schema_version: 1

context:
  name: glyphx
  version: "4.0.0"
  python_min: "3.12"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/glyphx-${{ version }}.tar.gz
  sha256: b703f7a9dcccc9d5404486fcd2a3258ee7773ec001f7f198c6e73a4cb481bb7a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=64
    - setuptools_scm >=8
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - numpy >=1.26
    - pandas >=2.1

tests:
  - python:
      imports:
        - glyphx
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/kjkoeller/glyphx
  documentation: https://glyphx.readthedocs.io/
  summary: A next-gen Python plotting library with SVG-first rendering, interactivity, themes, and clean defaults.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - thewchan
